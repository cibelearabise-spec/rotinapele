<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina de Pele</title>
<style>
  :root{
    --bg-top:#a7bcd6;
    --bg-bottom:#5b6d88;
    --glass:rgba(255,255,255,0.07);
    --glass-border:rgba(255,255,255,0.16);
    --glass-active:rgba(255,255,255,0.16);
    --text:#eef1f6;
    --dim:#a4adc0;
    --cyan:#9fe3f0;
    --silver:#c9cfdb;
    --amber:#e3bd7d;
    --blue:#7fb0e0;
    --teal:#7fd9c4;
    --purple:#b39ce0;
    --rose:#e0a0b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg, #a9c8e6 0%, #8fb0d6 100%);
    color:var(--text);
    display:flex;justify-content:center;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .phone{
    width:100%;max-width:400px;min-height:100vh;
    display:flex;flex-direction:column;
    padding:26px 20px 12px;
    background:
      radial-gradient(60% 30% at 50% 0%, rgba(255,255,255,0.16), transparent 70%),
      linear-gradient(180deg, rgba(20,26,38,0.12), rgba(20,26,38,0.5)),
      url('purificador.jpg');
    background-size:auto, auto, cover;
    background-position:center, center, center;
    background-repeat:no-repeat, no-repeat, no-repeat;
  }
  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--dim);font-size:13px;margin-top:4px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    background:var(--glass);border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;
    color:var(--dim);flex-shrink:0;cursor:pointer;
    backdrop-filter:blur(6px);
  }

  .page{display:none;flex:1;flex-direction:column;gap:20px;animation:fade .25s ease;}
  .page.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* dot-matrix / dotted futuristic numbers */
  .dotted{
    font-weight:800;
    color:transparent;
    letter-spacing:.03em;
    background-image:radial-gradient(rgba(255,255,255,0.95) 1.1px, transparent 1.5px);
    background-size:4px 4px;
    background-position:0 0;
    -webkit-background-clip:text;
    background-clip:text;
  }

  /* HOME */
  .score-row .dotted{font-size:46px;line-height:1;}
  .score-label{color:var(--dim);font-size:13px;margin-top:6px;}

  .face-stage{display:flex;justify-content:center;padding:6px 0 4px;}
  .face-ring{
    position:relative;width:140px;height:140px;border-radius:50%;
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .2s ease, box-shadow .3s ease;
    box-shadow:0 0 0 rgba(159,227,240,0);
  }
  .face-ring.done{box-shadow:0 0 26px rgba(159,227,240,0.45);}
  .face-ring:active{transform:scale(.96);}
  .face-ring svg{width:72px;height:72px;stroke:var(--silver);fill:none;stroke-width:1.6;}
  .face-ring.done svg{stroke:var(--cyan);}
  .face-hint{
    position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
    font-size:11px;color:var(--dim);white-space:nowrap;
  }

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .stat-card{
    position:relative;
    background:
      radial-gradient(140% 140% at 25% 12%, rgba(255,255,255,0.42), rgba(255,255,255,0.04) 55%),
      rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.38);
    border-radius:28px;padding:14px 16px;backdrop-filter:blur(14px);
    box-shadow:0 10px 22px rgba(15,25,45,0.22), inset 0 1px 0 rgba(255,255,255,0.3);
    display:flex;flex-direction:column;gap:8px;
    overflow:hidden;
  }
  .stat-card.c-blue{background:radial-gradient(140% 140% at 25% 12%, rgba(255,255,255,0.42), rgba(127,176,224,0.14) 55%), rgba(127,176,224,0.16); border-color:rgba(200,222,245,0.55);}
  .stat-card.c-teal{background:radial-gradient(140% 140% at 25% 12%, rgba(255,255,255,0.42), rgba(127,217,196,0.14) 55%), rgba(127,217,196,0.16); border-color:rgba(200,240,230,0.55);}
  .stat-card.c-purple{background:radial-gradient(140% 140% at 25% 12%, rgba(255,255,255,0.42), rgba(179,156,224,0.14) 55%), rgba(179,156,224,0.16); border-color:rgba(220,208,245,0.55);}
  .stat-card.c-rose{background:radial-gradient(140% 140% at 25% 12%, rgba(255,255,255,0.42), rgba(224,160,176,0.14) 55%), rgba(224,160,176,0.16); border-color:rgba(245,215,222,0.55);}
  .stat-card.c-amber{background:radial-gradient(140% 140% at 25% 12%, rgba(255,255,255,0.42), rgba(227,189,125,0.14) 55%), rgba(227,189,125,0.16); border-color:rgba(248,228,190,0.55);}
  .stat-top{display:flex;justify-content:space-between;align-items:center;}
  .stat-name{font-size:12px;color:var(--dim);}
  .ring-wrap{position:relative;width:58px;height:58px;display:flex;align-items:center;justify-content:center;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .val{position:absolute;font-size:16px;}

  .section-title{font-size:14px;color:var(--dim);margin:2px 0 -6px;}
  .routine-list{display:flex;flex-direction:column;gap:10px;}
  .routine-item{
    display:flex;align-items:center;gap:12px;
    background:radial-gradient(160% 160% at 15% 10%, rgba(255,255,255,0.3), rgba(255,255,255,0.03) 55%), rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;padding:12px 14px;backdrop-filter:blur(12px);
    box-shadow:0 6px 16px rgba(15,25,45,0.16), inset 0 1px 0 rgba(255,255,255,0.22);
    cursor:pointer;transition:background .2s ease;
  }
  .routine-item.checked{background:radial-gradient(160% 160% at 15% 10%, rgba(255,255,255,0.32), rgba(159,227,240,0.14) 55%), rgba(159,227,240,0.14);}
  .routine-item.c-blue{border-color:rgba(200,222,245,0.5);}
  .routine-item.c-teal{border-color:rgba(200,240,230,0.5);}
  .routine-item.c-amber{border-color:rgba(248,228,190,0.5);}
  .routine-item.c-purple{border-color:rgba(220,208,245,0.5);}
  .routine-item.c-rose{border-color:rgba(245,215,222,0.5);}
  .check{
    width:22px;height:22px;border-radius:50%;
    border:1.6px solid var(--silver);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:13px;color:transparent;
  }
  .routine-item.checked .check{border-color:var(--cyan);color:var(--cyan);}
  .r-name{font-size:14px;flex:1;}
  .r-time{font-size:11px;color:var(--dim);}

  /* CALENDAR */
  .cal-nav{display:flex;justify-content:space-between;align-items:center;}
  .cal-nav span{font-size:15px;font-weight:600;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;color:var(--dim);font-size:11px;text-align:center;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day{
    aspect-ratio:1;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;cursor:pointer;position:relative;backdrop-filter:blur(6px);
  }
  .day.today{border-color:var(--cyan);}
  .day.selected{background:var(--glass-active);}
  .day.type-am{background:rgba(227,189,125,0.13);border-color:rgba(227,189,125,0.26);}
  .day.type-pm{background:rgba(159,227,240,0.13);border-color:rgba(159,227,240,0.26);}
  .day.type-both{background:rgba(179,156,224,0.14);border-color:rgba(179,156,224,0.28);}
  .day.empty{background:transparent;border:none;cursor:default;}
  .dot-row{display:flex;gap:3px;margin-top:4px;}
  .dot{width:4px;height:4px;border-radius:50%;}
  .dot.am{background:var(--amber);}
  .dot.pm{background:var(--cyan);}

  .day-detail{
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:20px;padding:16px;backdrop-filter:blur(8px);
    display:flex;flex-direction:column;gap:10px;
  }
  .day-detail h3{margin:0;font-size:15px;font-weight:600;}
  .step-row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);}
  .step-row b{color:var(--text);font-weight:500;}

  /* PROGRESS */
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
  .bar{
    width:100%;border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg, rgba(159,227,240,0.55), rgba(159,227,240,0.12));
    border:1px solid var(--glass-border);
  }
  .bar-label{font-size:10px;color:var(--dim);}
  .prog-summary{display:flex;gap:14px;}
  .prog-card{flex:1;border-radius:20px;padding:14px;backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.32);
    box-shadow:0 8px 18px rgba(15,25,45,0.18), inset 0 1px 0 rgba(255,255,255,0.25);}
  .prog-card.c-teal{background:radial-gradient(150% 150% at 20% 10%, rgba(255,255,255,0.4), rgba(127,217,196,0.14) 55%), rgba(127,217,196,0.16);}
  .prog-card.c-blue{background:radial-gradient(150% 150% at 20% 10%, rgba(255,255,255,0.4), rgba(127,176,224,0.14) 55%), rgba(127,176,224,0.16);}
  .prog-card .dotted{font-size:26px;}
  .prog-card .lbl{font-size:11px;color:var(--dim);margin-top:4px;}

  /* NAV */
  nav{
    margin-top:auto;padding-top:16px;
    display:flex;justify-content:center;
  }
  .navpill{
    display:flex;gap:6px;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:22px;padding:6px;backdrop-filter:blur(10px);
  }
  .navpill button{
    border:none;background:transparent;color:var(--dim);
    padding:9px 16px;border-radius:16px;font-size:12px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;transition:background .2s ease,color .2s ease;
  }
  .navpill button.active{background:rgba(255,255,255,0.16);color:var(--text);}
  .navpill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
</style>
</head>
<body>
<div class="phone">

  <!-- HOME -->
  <div class="page active" id="page-home">
    <header>
      <div>
        <h1>Rotina de Pele</h1>
        <div class="sub" id="todayLabel">—</div>
      </div>
      <div class="icon-btn">⌄</div>
    </header>

    <div class="score-row">
      <div class="dotted" id="skinScore">92</div>
      <div class="score-label">Pontuação de pele hoje</div>
    </div>

    <div class="face-stage">
      <div class="face-ring" id="faceRing">
        <svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 1 5 5v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V8a5 5 0 0 1 5-5Z"/><path d="M9 11c.3.6.9 1 1.5 1M15 11c-.3.6-.9 1-1.5 1"/><path d="M10 16c.6.5 1.3.8 2 .8s1.4-.3 2-.8"/></svg>
        <span class="face-hint" id="faceHint">toque ao concluir a rotina</span>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-title">Rotina de hoje</div>
    <div class="routine-list" id="routineList"></div>
  </div>

  <!-- CALENDAR -->
  <div class="page" id="page-cal">
    <header>
      <div>
        <h1>Calendário</h1>
        <div class="sub">Cronograma da pele</div>
      </div>
      <div class="icon-btn">⌄</div>
    </header>
    <div class="cal-nav"><span id="calMonth">—</span></div>
    <div class="weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    <div class="days" id="daysGrid"></div>
    <div class="day-detail" id="dayDetail"></div>
  </div>

  <!-- PROGRESS -->
  <div class="page" id="page-prog">
    <header>
      <div>
        <h1>Progresso</h1>
        <div class="sub">Últimos 7 dias</div>
      </div>
      <div class="icon-btn">⌄</div>
    </header>
    <div class="bars" id="barsChart"></div>
    <div class="prog-summary">
      <div class="prog-card c-teal"><div class="dotted">+11</div><div class="lbl">Melhora na semana</div></div>
      <div class="prog-card c-blue"><div class="dotted">86%</div><div class="lbl">Rotinas concluídas</div></div>
    </div>
  </div>

  <nav>
    <div class="navpill">
      <button data-page="home" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>
        Início
      </button>
      <button data-page="cal">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></svg>
        Calendário
      </button>
      <button data-page="prog">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
        Progresso
      </button>
    </div>
  </nav>
</div>

<script>
const stats = [
  {name:'Hidratação', val:82, c:'c-blue'},
  {name:'Oleosidade', val:34, c:'c-amber'},
  {name:'Textura', val:71, c:'c-teal'},
  {name:'Poros', val:58, c:'c-purple'},
];
const routine = [
  {name:'Limpeza', time:'Manhã · 7h30', done:true, c:'c-blue'},
  {name:'Vitamina C', time:'Manhã · 7h35', done:true, c:'c-amber'},
  {name:'Protetor solar', time:'Manhã · 7h40', done:false, c:'c-teal'},
  {name:'Retinol', time:'Noite · 22h', done:false, c:'c-purple'},
  {name:'Hidratante', time:'Noite · 22h05', done:false, c:'c-rose'},
];

function ringSVG(v,size,strokeW){
  const r=(size/2)-strokeW;
  const c=2*Math.PI*r;
  const off=c-(v/100)*c;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,0.14)" stroke-width="${strokeW}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#9fe3f0" stroke-width="${strokeW}" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:center;"/></svg>`;
}

function renderStats(){
  const el = document.getElementById('statsGrid');
  el.innerHTML = stats.map(s=>`
    <div class="stat-card ${s.c}">
      <div class="stat-top"><span class="stat-name">${s.name}</span></div>
      <div class="ring-wrap">${ringSVG(s.val,58,5)}<span class="val dotted" style="font-size:16px;">${s.val}</span></div>
    </div>`).join('');
}

function renderRoutine(){
  const el = document.getElementById('routineList');
  el.innerHTML = routine.map((r,i)=>`
    <div class="routine-item ${r.c} ${r.done?'checked':''}" data-i="${i}">
      <div class="check">${r.done?'✓':''}</div>
      <span class="r-name">${r.name}</span>
      <span class="r-time">${r.time}</span>
    </div>`).join('');
  el.querySelectorAll('.routine-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const i = +item.dataset.i;
      routine[i].done = !routine[i].done;
      renderRoutine();
      updateFace();
    });
  });
}

function updateFace(){
  const allDone = routine.every(r=>r.done);
  const ring = document.getElementById('faceRing');
  ring.classList.toggle('done', allDone);
  document.getElementById('faceHint').textContent = allDone ? 'rotina concluída' : 'toque ao concluir a rotina';
}

document.getElementById('faceRing').addEventListener('click',()=>{
  const allDone = routine.every(r=>r.done);
  routine.forEach(r=>r.done = !allDone);
  renderRoutine();
  updateFace();
});

const today = new Date();
document.getElementById('todayLabel').textContent = today.toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'});

// CALENDAR
const monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let selectedDay = today.getDate();
const scheduleType = d => d%3===0 ? 'both' : d%2===0 ? 'pm' : 'am';

function renderCalendar(){
  document.getElementById('calMonth').textContent = `${monthNames[today.getMonth()]} ${today.getFullYear()}`;
  const first = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
  const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const grid = document.getElementById('daysGrid');
  let html='';
  for(let i=0;i<first;i++) html += `<div class="day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const type = scheduleType(d);
    const isToday = d===today.getDate();
    const isSel = d===selectedDay;
    html += `<div class="day type-${type} ${isToday?'today':''} ${isSel?'selected':''}" data-d="${d}">
      <span>${d}</span>
      <div class="dot-row">${type==='am'||type==='both'?'<span class="dot am"></span>':''}${type==='pm'||type==='both'?'<span class="dot pm"></span>':''}</div>
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.day:not(.empty)').forEach(el=>{
    el.addEventListener('click',()=>{
      selectedDay = +el.dataset.d;
      renderCalendar();
      renderDayDetail();
    });
  });
}

function renderDayDetail(){
  const type = scheduleType(selectedDay);
  const steps = [];
  if(type==='am'||type==='both') steps.push(['Manhã','Limpeza, Vitamina C, Protetor solar']);
  if(type==='pm'||type==='both') steps.push(['Noite','Limpeza, Retinol, Hidratante']);
  document.getElementById('dayDetail').innerHTML = `
    <h3>Dia ${selectedDay} de ${monthNames[today.getMonth()]}</h3>
    ${steps.map(s=>`<div class="step-row"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('') || '<div class="step-row">Sem rotina agendada</div>'}
  `;
}

// PROGRESS
const week = [
  {d:'Seg',v:74},{d:'Ter',v:78},{d:'Qua',v:81},{d:'Qui',v:80},{d:'Sex',v:85},{d:'Sáb',v:88},{d:'Dom',v:92}
];
function renderBars(){
  const max = 100;
  document.getElementById('barsChart').innerHTML = week.map(w=>`
    <div class="bar-col">
      <span class="dotted" style="font-size:12px;">${w.v}</span>
      <div class="bar" style="height:${(w.v/max)*100}%;"></div>
      <span class="bar-label">${w.d}</span>
    </div>`).join('');
}

// NAV
document.querySelectorAll('.navpill button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.navpill button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
  });
});

renderStats();
renderRoutine();
updateFace();
renderCalendar();
renderDayDetail();
renderBars();
</script>
</body>
</html>
